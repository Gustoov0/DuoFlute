# Gateway do DuoFlute
# /api/*  -> back-end (FastAPI), balanceado entre as réplicas
# /*      -> front-end (React)

# Docker resolve "backend" para o IP de CADA réplica; o Nginx faz round-robin entre eles.
# Após mudar o número de réplicas, reinicie o gateway: docker compose restart gateway
upstream api {
    server backend:8000;
}

server {
    listen 80;
    client_max_body_size 50m;        # limite de upload (fotos e vídeos)

    location /api/ {
        proxy_pass http://api;       # sem barra final: o prefixo /api é mantido
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
