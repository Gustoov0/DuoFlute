# =====================================================================
# DuoFlute - docker-compose.yml
#
# Desenvolvimento (carrega o docker-compose.override.yml automaticamente):
#     docker compose up --build
#
# Teste de escala / "modo produção" (ignora o override):
#     docker compose -f docker-compose.yml up --build -d --scale backend=3
#
# Derrubar (mantém os dados):   docker compose down
# Derrubar e apagar os dados:   docker compose down -v
# =====================================================================

services:

  # ---------- Ponto único de entrada (proxy reverso / balanceador) ----------
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                      # se a porta 80 estiver ocupada, use "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy   # o Nginx precisa que "backend" já exista na rede
    networks:
      - public-net
    restart: unless-stopped

  # ---------- Front-end ----------
  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    networks:
      - public-net
    restart: unless-stopped

  # ---------- Migrações (roda UMA vez e termina) ----------
  # Separar as migrações do back-end evita que várias réplicas tentem
  # alterar o banco ao mesmo tempo quando você escalar.
  migrate:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private-net
    restart: "no"

  # ---------- Back-end (API FastAPI) ----------
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379/0
    expose:
      - "8000"                       # sem "ports": só o gateway enxerga a API
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - public-net                   # para conversar com o gateway
      - private-net                  # para conversar com o banco e o Redis
    restart: unless-stopped

  # ---------- Banco de dados ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private-net
    restart: unless-stopped

  # ---------- Cache / ranking ----------
  cache:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - private-net
    restart: unless-stopped

  # =====================================================================
  # FASE 3 (opcional): descomente quando for implementar
  # =====================================================================

  # worker:                          # tarefas assíncronas (conquistas, ranking, áudio)
  #   build:
  #     context: ./backend
  #   command: celery -A app.worker worker --loglevel=info
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #     REDIS_URL: redis://cache:6379/0
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     cache:
  #       condition: service_healthy
  #   networks:
  #     - private-net

  # storage:                         # armazenamento de fotos e vídeos (compatível com S3)
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  #   volumes:
  #     - miniodata:/data
  #   networks:
  #     - private-net

# ---------- Redes ----------
networks:
  public-net:                        # gateway <-> frontend <-> backend
  private-net:                       # backend <-> db <-> cache (isolada)
    internal: true                   # sem acesso à internet nem ao host

# ---------- Volumes ----------
volumes:
  pgdata:
  redisdata:
  # miniodata: