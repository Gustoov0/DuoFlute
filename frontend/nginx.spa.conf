# Usado só na imagem de produção do front-end.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Qualquer outra rota cai no index.html (o React Router resolve a rota)
    location / {
        try_files $uri /index.html;
    }
}